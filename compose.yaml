# Use postgres/example user/password credentials

services:

  db:
    image: postgres:18
    restart: always
    volumes:
     - db-data:/var/lib/postgresql
     - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: enterprise
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "6543:5432"
  

volumes:
  db-data: